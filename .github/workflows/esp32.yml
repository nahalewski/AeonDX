# Builds the ESP32-S3 firmware in tools/nintendo_link (the BLE link and the
# LDN sniffer) with ESP-IDF, so a change that doesn't compile shows here.
name: ESP32 firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/nintendo_link/esp32_s3_*/**
      - .github/workflows/esp32.yml

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [esp32_s3_ble_link, esp32_s3_sniffer]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.project }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32s3
          path: tools/nintendo_link/${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}
          path: |
            tools/nintendo_link/${{ matrix.project }}/build/*.bin
            tools/nintendo_link/${{ matrix.project }}/build/bootloader/bootloader.bin
            tools/nintendo_link/${{ matrix.project }}/build/partition_table/partition-table.bin
